[tool.poetry]
name = "bootstrap"
version = "1.3.0"
description = "Automatic setup of new machines"
authors = ["Tommy Carpenter <tommyjcarpenter@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.3"
jsonschema = "^4.14.0"

# Mark the dev group optional so plain `poetry install` (runtime use of the
# `runboot` script) does not pull ruff. Contributors get it via the
# Makefile's `install-dev` target, which passes `--with dev`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
# Pinned to the same version CI installs (.github/workflows/lint.yml). Bump
# in lockstep with the workflow so `make lint` and CI agree on formatting.
ruff = "0.15.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
runboot = "bootstrap.runboot:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]  # isort-style import sorting
