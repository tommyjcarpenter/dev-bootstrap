[project]
name = "bootstrap"
version = "1.3.1"
description = "Automatic setup of new machines"
authors = [{ name = "Tommy Carpenter", email = "tommyjcarpenter@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.3",
    "jsonschema>=4.14.0",
]

[project.scripts]
runboot = "bootstrap.runboot:main"

# Pinned to the same version CI installs (.github/workflows/lint.yml). Bump in
# lockstep with the workflow so `make lint` and CI agree on formatting.
[dependency-groups]
dev = ["ruff==0.15.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]  # isort-style import sorting
