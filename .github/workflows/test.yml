name: Test

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'bootstrap/**'
      - 'poetry.lock'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'bootstrap/**'
      - 'poetry.lock'
      - 'pyproject.toml'

jobs:
  smoke:
    name: Smoke (import) tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime deps
        run: pip install click 'jsonschema>=4.14.0'

      - name: Run smoke tests
        run: python -m unittest discover -v tests
