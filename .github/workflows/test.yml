name: Test

on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'bootstrap/**'
      - 'uv.lock'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'bootstrap/**'
      - 'uv.lock'
      - 'pyproject.toml'

jobs:
  smoke:
    name: Smoke (import) tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install deps
        run: uv sync

      - name: Run smoke tests
        run: uv run python -m unittest discover -v tests
