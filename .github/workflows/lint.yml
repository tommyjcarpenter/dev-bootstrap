name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install deps
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check bootstrap/

      - name: Run ruff format (check only)
        run: uv run ruff format --check bootstrap/
