name: Schema

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-sample:
    name: Validate sample_config.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install deps
        run: uv sync

      - name: Validate sample_config.json against bootstrap/schema.py
        run: |
          uv run python - <<'PY'
          import json
          from bootstrap.schema import config_validate
          with open("sample_config.json") as f:
              cfg = json.load(f)
          config_validate(cfg)
          print("sample_config.json is valid")
          PY
